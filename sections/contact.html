<!-- Contact Section -->
<section class="py-24 max-w-max-width mx-auto px-edge-margin fade-up" id="contact">
<h2 class="font-h2 text-h2 mb-stack-lg text-char">BOOK A JOB.</h2>
<div class="flex flex-col lg:flex-row gap-12">
<div class="w-full lg:w-1/2">
<form class="space-y-4">
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div>
<label class="block font-ui-label text-ui-label text-char mb-2 uppercase" for="name">Name</label>
<input class="w-full bg-surface p-3 brutal-input-border rounded focus:outline-none focus:border-olive focus:ring-1 focus:ring-olive transition-colors font-body-md text-char" id="name" type="text"/>
</div>
<div>
<label class="block font-ui-label text-ui-label text-char mb-2 uppercase" for="phone">Phone</label>
<input class="w-full bg-surface p-3 brutal-input-border rounded focus:outline-none focus:border-olive focus:ring-1 focus:ring-olive transition-colors font-body-md text-char" id="phone" type="tel"/>
</div>
</div>
<div>
<label class="block font-ui-label text-ui-label text-char mb-2 uppercase" for="email">Email</label>
<input class="w-full bg-surface p-3 brutal-input-border rounded focus:outline-none focus:border-olive focus:ring-1 focus:ring-olive transition-colors font-body-md text-char" id="email" type="email"/>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div>
<label class="block font-ui-label text-ui-label text-char mb-2 uppercase" for="job-type">Job Type</label>
<select class="w-full bg-surface p-3 brutal-input-border rounded focus:outline-none focus:border-olive focus:ring-1 focus:ring-olive transition-colors font-body-md text-char" id="job-type">
<option>Plumbing</option>
<option>Carpentry</option>
<option>Electrical</option>
<option>Painting</option>
<option>Other / Multiple</option>
</select>
</div>
<div>
<label class="block font-ui-label text-ui-label text-char mb-2 uppercase" for="date">Preferred Date</label>
<input class="w-full bg-surface p-3 brutal-input-border rounded focus:outline-none focus:border-olive focus:ring-1 focus:ring-olive transition-colors font-body-md text-char" id="date" type="date"/>
</div>
</div>
<div>
<label class="block font-ui-label text-ui-label text-char mb-2 uppercase" for="message">Message Details</label>
<textarea class="w-full bg-surface p-3 brutal-input-border rounded focus:outline-none focus:border-olive focus:ring-1 focus:ring-olive transition-colors font-body-md text-char" id="message" rows="4"></textarea>
</div>
<button class="w-full bg-primary text-on-primary font-button text-button uppercase px-8 py-4 border-[1.5px] border-on-surface rounded hover:bg-secondary transition-colors mt-4" type="submit">Send Request</button>
</form>
</div>
<div class="w-full lg:w-1/2 flex flex-col gap-8">
<div class="w-full max-w-[320px] aspect-square bg-card border-[1.5px] border-[#c5c8bc] rounded flex items-center justify-center relative overflow-hidden">
<span class="material-symbols-outlined text-4xl text-outline">map</span>
<!-- Map placeholder -->

</div>
<div class="space-y-4 border-l-[1.5px] border-olive pl-6">
<div class="flex items-center gap-2 mb-6">
<div class="w-3 h-3 rounded-full bg-olive pulse"></div>
<span class="font-ui-label text-ui-label uppercase text-olive">Response within 2 hours</span>
</div>
<div>
<p class="font-ui-label text-ui-label uppercase text-on-surface-variant mb-1">Service Area</p>
<p class="font-body-bold text-body-bold text-char">Portland Metro Area (25 mile radius)</p>
</div>
<div>
<p class="font-ui-label text-ui-label uppercase text-on-surface-variant mb-1">Direct Line</p>
<p class="font-body-bold text-body-bold text-char">(555) 248-9910</p>
</div>
<div>
<p class="font-ui-label text-ui-label uppercase text-on-surface-variant mb-1">Email</p>
<p class="font-body-bold text-body-bold text-char">mack@mackhandyman.com</p>
</div>
</div>
</div>
</div>
</section>
